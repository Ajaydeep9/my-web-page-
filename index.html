    // Custom Scroll Reveal Hook
    function useScrollReveal() {
      useEffect(() => {
        const observerCallback = (entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
            }
          });
        };

        const observerOptions = {
          threshold: 0.12,
          rootMargin: "0px 0px -40px 0px"
        };

        const observer = new IntersectionObserver(observerCallback, observerOptions);
        const elements = document.querySelectorAll('.reveal-element');
        elements.forEach(el => observer.observe(el));

        return () => observer.disconnect();
      }, []);
    }

    // Animated Counter Component
    function AnimatedStat({ value, label, subtext }) {
      const [count, setCount] = useState(0);
      const [hasAnimated, setHasAnimated] = useState(false);
      const statRef = useRef(null);

      // Extract numeric base if possible (e.g., '25-40+' -> display string after animation)
      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting && !hasAnimated) {
              setHasAnimated(true);
            }
          },
          { threshold: 0.4 }
        );

        if (statRef.current) observer.observe(statRef.current);
        return () => observer.disconnect();
      }, [hasAnimated]);

      useEffect(() => {
        if (!hasAnimated) return;
        let start = 0;
        const end = 100;
        const duration = 1200;
        const stepTime = Math.abs(Math.floor(duration / end));

        const timer = setInterval(() => {
          start += 2;
          setCount(start);
          if (start >= end) clearInterval(timer);
        }, stepTime);

        return () => clearInterval(timer);
      }, [hasAnimated]);

      return (
        <div ref={statRef} className="reveal-element text-center p-5 relative group">
          <div className="font-serif text-3xl lg:text-4xl font-bold gold-gradient-text tracking-tight transition-transform duration-300 group-hover:scale-105">
            {value}
          </div>
          <div className="w-10 h-0.5 bg-gold-500/60 mx-auto my-3 transition-all duration-300 group-hover:w-16 group-hover:bg-gold-400"></div>
          <p className="text-xs uppercase tracking-widest text-slate-300 font-medium leading-relaxed">
            {label}
          </p>
          {subtext && <p className="text-[11px] text-slate-400 mt-1">{subtext}</p>}
        </div>
      );
    }
